<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase 13.1 Browser Persistence Smoke Test</title>
    <style>
      body { margin: 0; padding: 32px; font: 16px/1.6 system-ui, sans-serif; color: #111827; }
      main { max-width: 760px; margin: 0 auto; }
      li { margin: 8px 0; }
      .pass { color: #047857; }
      .fail { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Phase 13.1 Browser Persistence Smoke Test</h1>
      <p id="status">正在验证 IndexedDB Repository...</p>
      <ol id="checks"></ol>
    </main>
    <script type="module">
      import { runLearningSessionHistoryBrowserSmoke } from './src/ai/tests/runLearningSessionHistoryBrowserSmoke.ts';

      const status = document.querySelector('#status');
      const checks = document.querySelector('#checks');

      try {
        const report = await runLearningSessionHistoryBrowserSmoke();
        status.textContent = report.passed ? 'PASS' : 'FAIL';
        status.className = report.passed ? 'pass' : 'fail';
        for (const item of report.checks) {
          const row = document.createElement('li');
          row.className = item.passed ? 'pass' : 'fail';
          row.textContent = `${item.passed ? 'PASS' : 'FAIL'} - ${item.detail}`;
          checks.append(row);
        }
      } catch (error) {
        status.textContent = `FAIL - ${error instanceof Error ? error.message : String(error)}`;
        status.className = 'fail';
      }
    </script>
  </body>
</html>
